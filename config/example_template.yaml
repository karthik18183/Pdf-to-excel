# Example template for a (fictional) 'Boba Bank'
date_patterns:
  - '(?:\d{2}/\d{2}/\d{4})'   # 08/12/2025
  - '(?:\d{1,2}-\d{1,2}-\d{2})' # 8-12-25
line_regex: '^(?P<date>\d{1,2}[\-/]\d{1,2}[\-/]\d{2,4})\s+(?P<desc>.+?)\s+(?P<amount>[\(\)\-\+]?\d{1,3}(?:,\d{3})*(?:\.\d{2})?)\s+(?P<balance>\d{1,3}(?:,\d{3})*(?:\.\d{2})?)$'
split_credit_debit: true
negative_is_debit: true
