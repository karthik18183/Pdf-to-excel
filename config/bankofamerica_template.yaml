# Bank of America - SafeBalance / General Checking template
# Matches rows like:
# 09/17/25  MOBILE PURCHASE 0916 WM SUPERCENTER SPRINGDALE  AR   -35.18

date_patterns:
  - '(?:\d{2}/\d{2}/\d{2,4})'   # 09/17/25 or 08/26/2025

# Core line regex: Date + Description + Amount at end
line_regex: >
  ^(?P<date>\d{2}/\d{2}/\d{2,4})\s+
  (?P<desc>.+?)\s+
  (?P<amount>[\-\+]?[0-9,]+(?:\.[0-9]{2})?)$

split_credit_debit: true
negative_is_debit: true

# Lines to ignore entirely (section headers, totals, boilerplate)
ignore_patterns:
  - '^Total\s'
  - '^Account summary'
  - '^Service fees$'
  - '^Important Information'
  - '^Withdrawals and other subtractions'
  - '^Other subtractions'
  - '^ATM and debit card subtractions'
  - '^Page\s+\d+\s+of\s+\d+$'
